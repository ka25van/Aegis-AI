apiVersion: v1
kind: Secret
metadata:
  name: aegis-secrets
  namespace: aegis
  labels:
    app.kubernetes.io/name: aegis
    app.kubernetes.io/part-of: aegis-ai
type: Opaque
stringData:
  # SECURITY: Replace dev values before any non-dev cluster.
  # Preferred: SealedSecrets or ExternalSecrets Operator (e.g. AWS Secrets Manager).
  # Imperative (avoids committing secrets):
  #   kubectl create secret generic aegis-secrets -n aegis \
  #     --from-literal=DATABASE_URL='postgresql+asyncpg://postgres:STRONG_PW@postgres:5432/aegis' \
  #     --from-literal=SECRET_KEY="$(openssl rand -hex 32)" \
  #     --from-literal=POSTGRES_PASSWORD='STRONG_PW' \
  #     --from-literal=ALERT_WEBHOOK_SECRET="$(openssl rand -hex 24)" \
  #     --dry-run=client -o yaml | kubectl apply -f -
  #
  # Values below are for local/dev clusters only (ENV=dev). In prod (ENV=prod)
  # config.py _validate_secret_key rejects <32 chars and CORS wildcard.
  DATABASE_URL: "postgresql+asyncpg://postgres:aegis-postgres-pw@postgres:5432/aegis"
  SECRET_KEY: "dev-secret-key-change-in-production-k8s-min-32-chars-long"
  POSTGRES_PASSWORD: "aegis-postgres-pw"
  ALERT_WEBHOOK_SECRET: "dev-alert-webhook-secret-change-me"
